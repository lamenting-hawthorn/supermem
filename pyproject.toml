[project]
name = "supermem"
version = "0.3.0"
description = "Persistent AI memory without RAG — four-tier retrieval (SQLite FTS5 → graph → vectors → LLM agent)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Hawthorn", email = "rv.help23@gmail.com" },
]
keywords = ["mcp", "memory", "ai", "llm", "rag", "fts5", "semantic-search", "knowledge-base"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"

dependencies = [
    # ── supermem-core ──────────────────────────────────────────────────────────
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",

    # ── Storage ───────────────────────────────────────────────────────────────
    "aiosqlite>=0.22.1",
    "kuzu>=0.11.3",
    "watchdog>=6.0.0",

    # ── MCP server ────────────────────────────────────────────────────────────
    "fastmcp",
    "pygments>=2.19.2",

    # ── LLM clients (cloud — lightweight) ────────────────────────────────────
    "openai>=1.30.0",
    "aiofiles",
    "jinja2",
    "httpx>=0.27.0",

    # ── CLI ───────────────────────────────────────────────────────────────────
    "rich>=13.7.0",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
# HTTP dashboard + SSE transport (separate from core MCP)
worker = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sse-starlette>=2.0.0",
]
# ChromaDB vector retrieval (tier 3)
vector = [
    "chromadb>=0.4.0",
    "sentence-transformers>=3.0.0",
]
# Local LLM inference (vLLM, HuggingFace models)
local = [
    "vllm>=0.5.5; sys_platform != 'darwin'",
    "huggingface-hub>=0.34.3",
    "transformers>4.51.0,<4.54.0",
]
# Anthropic Claude provider
claude = [
    "anthropic>=0.30.0",
]
# Everything
all = [
    "supermem[worker]",
    "supermem[vector]",
    "supermem[local]",
    "supermem[claude]",
]

[project.urls]
Homepage = "https://github.com/lamenting-hawthorn/supermem"
Repository = "https://github.com/lamenting-hawthorn/supermem"
Documentation = "https://github.com/lamenting-hawthorn/supermem"
"Bug Tracker" = "https://github.com/lamenting-hawthorn/supermem/issues"

[project.scripts]
supermem = "supermem.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "supermem",
    "agent",
    "mcp_server",
    "memory_connectors",
]

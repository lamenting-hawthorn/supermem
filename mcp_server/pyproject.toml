[project]
name = "mcp-server"
version = "0.1.0"
description = "FastMCP server exposing lifecycle-aware SuperMem tools over trusted stdio or authenticated loopback HTTP"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "vllm; sys_platform != 'darwin'",
    "agent",
    "pygments>=2.19.2",
    "fastapi",
    "uvicorn",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "settings", "memory_setup"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.uv.sources]
agent = { workspace = true }
